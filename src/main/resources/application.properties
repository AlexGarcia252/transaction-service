# Servidor HTTP
quarkus.http.port=8083

# Configuración de Base de Datos (PostgreSQL Local)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/transaction_db
quarkus.datasource.username=postgres
quarkus.datasource.password=admin1

# Hibernate ORM
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# Cliente REST (Apunta al account-service)
quarkus.rest-client.account-api.url=http://localhost:8082

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*